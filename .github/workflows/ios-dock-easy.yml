name: iOS Dock Easy Build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-dock-easy.yml'
permissions:
  contents: read
jobs:
  dock:
    name: Build separate iOS Dock APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Patch icon animation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("launcher/app/src/main/java/com/gathin/tvhome/MainActivity.java")
          s = p.read_text(encoding="utf-8")
          old1 = "            if (!onTile) hideGlass();"
          new1 = """            if (!onTile) {
                          hideGlass();
                          animateDockNeighbors(-1);
                      }"""
          old2 = "        View item = (View) card.getParent();"
          new2 = "        animateDockNeighbors(position);\n" + old2
          anchor = "    /** Refits the glass to the focused holder once the grid layout and tile dimensions settle. */"
          new_method = """
              private void animateDockNeighbors(int focused) {
                  if (!dockRow || !animations || reducedMotion || grid == null || adapter == null) return;
                  int count = Math.min(COLUMNS, adapter.appCount());
                  for (int i = 0; i < count; i++) {
                      RecyclerView.ViewHolder holder = grid.findViewHolderForAdapterPosition(i);
                      if (holder == null) continue;
                      View tile = holder.itemView.findViewById(R.id.card);
                      if (tile == null || tile.isFocused() || tile.getVisibility() != View.VISIBLE) continue;
                      int gap = focused < 0 ? 100 : Math.abs(i - focused);
                      float scale = gap == 1 ? 1.06f : (gap == 2 ? 1.025f : 1f);
                      float lift = gap == 1 ? -4f * density : (gap == 2 ? -2f * density : 0f);
                      tile.animate().cancel();
                      tile.animate().scaleX(scale).scaleY(scale).translationY(lift)
                              .setDuration(200L)
                              .setInterpolator(new android.view.animation.DecelerateInterpolator(1.4f))
                              .start();
                  }
              }

          """
          for title, old, new in (
              ("Focus listener", old1, new1),
              ("Dock focus", old2, new2),
              ("Method location", anchor, new_method + anchor)
          ):
              if s.count(old) != 1:
                  raise RuntimeError(f"{title} changed in source; stopping without modifying")
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          print("DOCK PATCH OK")
          PY
      - name: Build separate APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PlauncherApplicationId=com.gathin.tvhome.iosdock assembleRelease
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-iOS-Dock-Easy
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
